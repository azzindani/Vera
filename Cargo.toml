[package]
name = "Vera"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "Vera"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
vera-embed = { version = "0.0.1", path = "crates/vera-embed" }

[workspace]
resolver = "3"
members = [
    "crates/vera-core",
    "crates/vera-embed",
    "crates/vera-store",
    "crates/vera-engine",
    "crates/vera-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
