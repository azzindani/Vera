[workspace]
resolver = "3"
members = [
    "crates/contract",
    "crates/embed",
    "crates/store",
    "crates/engine",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/azzindani/Vera"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# ! Release profile, ✗ defaults. The engine is deployed as a container on a
# 2 vCPU box: one codegen unit and LTO buy a smaller, faster binary for build
# time paid once in CI.
#
# ! Unwinding is kept (✗ `panic = "abort"`). tokio isolates a panicking task,
# so one malformed request fails alone; aborting would take every in-flight
# request with it for no gain a stateless server can use.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
