[package]
name = "vera"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "vera"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
embed = { version = "0.0.1", path = "crates/embed" }

[workspace]
resolver = "3"
members = [
    "crates/contract",
    "crates/embed",
    "crates/store",
    "crates/engine",
    "crates/mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
