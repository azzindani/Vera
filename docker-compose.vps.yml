# VPS emulation overlay · 2 vCPU / 4 GB.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# ! Testing on 14 cores and 48 GB proves nothing about the target box. The OOM
# guarantee (CLAUDE.md §5.4) and every latency number are claims about 2 vCPU /
# 4 GB, so they are only under test with this overlay on.
#
# cpuset pins db and engine to the SAME two host cores. A per-container `cpus:`
# limit cannot express that: on the real VPS, Postgres and the engine contend
# for two cores, and that contention is what sets p95 under concurrency. Give
# each its own pair and the numbers come out optimistic.
#
# The 4 GB budget, measured rather than guessed (see docs/HARDWARE.md §2):
#
#   embed   1280 MB   model weights measured at 1060 MB anon, + runtime
#   db      1792 MB   shared_buffers 512 + work_mem + the rest as page cache
#   engine   512 MB   ~13 MB measured. Vastly oversized, deliberately: see below
#   ----------------
#   total   3584 MB   leaving ~512 MB for the OS
#
# ! The engine line used to read "8.5 MB + 4 concurrent x 23.4 MB = 102 MB". That
# was arithmetic and was never measured. Measured peak RSS is 14/12/14 MB across
# CLUSTER_BATCH 1/2/5 -- flat, because the engine never holds a cluster; Postgres
# does the scan and returns ranked ids (docs/HARDWARE.md §2).
#
# The 512 MB stays anyway. It costs nothing on a box this size, and the headroom
# is what a bad day is for. The honest statement is that it is a ceiling, ✗ a
# fitted budget -- and that the memory this profile actually has to get right is
# Postgres's, which is where every scanned page lives.
#
# ! shared_buffers drops 1500 -> 512 MB. On a 4 GB box with a 2.4 GB database,
# page cache beats a big private buffer pool: every arm is a scan, and scans are
# exactly what Postgres declines to keep in shared_buffers anyway (it ring-
# buffers large sequential reads to avoid evicting everything else).

services:
  db:
    cpuset: "${VPS_CPUSET:-0,1}"
    command:
      - postgres
      # ! A compose `command` REPLACES the base file's, it does not merge with
      # it. Every flag the base sets has to be repeated here or it is silently
      # lost -- and losing this one makes migration 0004's CREATE EXTENSION fail
      # only under the overlay, which is the hardest kind of bug to see.
      - -c
      - shared_preload_libraries=pg_search
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1200MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=32
      - -c
      - log_min_duration_statement=1000
      # 2 vCPU: one parallel worker, not the default 2. Three processes
      # competing for two cores makes p95 worse, not better.
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_workers=2
    deploy:
      resources:
        limits:
          memory: 1792M

  embed:
    deploy:
      resources:
        limits:
          memory: 1280M

  engine:
    cpuset: "${VPS_CPUSET:-0,1}"
    deploy:
      resources:
        limits:
          memory: 512M
