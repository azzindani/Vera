# VPS emulation overlay · 2 vCPU / 8 GB.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# ! Testing on 14 cores and 48 GB proves nothing about the target box. Every
# latency number is a claim about 2 vCPU, so it is only under test with this
# overlay on -- and `cpuset` is the half that matters. Constraining memory while
# leaving the embedder free to use every core produced a p50 of 866 ms that was
# published as a 2-vCPU figure for months and was nothing of the kind.
#
# cpuset pins db and engine to the SAME two host cores. A per-container `cpus:`
# limit cannot express that: on the real VPS, Postgres and the engine contend
# for two cores, and that contention is what sets p95 under concurrency. Give
# each its own pair and the numbers come out optimistic.
#
# The 4 GB budget, measured rather than guessed (see docs/HARDWARE.md §2):
#
#   embed   3072 MB   float32 weights measured at 2,553 MB anon, + runtime.
#                     ! 1280 MB was budgeted here for months and fits NO usable
#                     configuration: float32 is SIGKILLed by its first request,
#                     and the narrow dtypes that do fit are 22x slower on CPU
#                     (docs/HARDWARE.md §2).
#   db      4096 MB   shared_buffers 512 + work_mem + the rest as page cache.
#                     Measured peak 1,846 MB at 355K rows, 5,907 MB at 5.1M.
#   engine   512 MB   14 MB at 355K, 42 MB at 5.1M. Oversized deliberately.
#   ----------------
#   total   7680 MB   leaving ~512 MB for the OS
#
# ! THIS IS NO LONGER A 4 GB PROFILE. It was, while the embedder was budgeted at
# 1,280 MB -- a figure that fits no usable configuration. The smallest box that
# runs this stack correctly is 8 GB, and the file name is now wrong rather than
# the numbers. Renaming it is a separate change; being honest about it is not.
#
# ! The engine line used to read "8.5 MB + 4 concurrent x 23.4 MB = 102 MB". That
# was arithmetic and was never measured. Measured peak RSS is 14/12/14 MB across
# CLUSTER_BATCH 1/2/5 -- flat, because the engine never holds a cluster; Postgres
# does the scan and returns ranked ids (docs/HARDWARE.md §2).
#
# The 512 MB stays anyway. It costs nothing on a box this size, and the headroom
# is what a bad day is for. The honest statement is that it is a ceiling, ✗ a
# fitted budget -- and that the memory this profile actually has to get right is
# Postgres's, which is where every scanned page lives.
#
# ! shared_buffers drops 1500 -> 512 MB. On a 4 GB box with a 2.4 GB database,
# page cache beats a big private buffer pool: every arm is a scan, and scans are
# exactly what Postgres declines to keep in shared_buffers anyway (it ring-
# buffers large sequential reads to avoid evicting everything else).

services:
  db:
    cpuset: "${VPS_CPUSET:-0,1}"
    command:
      - postgres
      # ! A compose `command` REPLACES the base file's, it does not merge with
      # it. Every flag the base sets has to be repeated here or it is silently
      # lost -- and losing this one makes migration 0004's CREATE EXTENSION fail
      # only under the overlay, which is the hardest kind of bug to see.
      - -c
      - shared_preload_libraries=pg_search
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1200MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=32
      - -c
      - log_min_duration_statement=1000
      # 2 vCPU: one parallel worker, not the default 2. Three processes
      # competing for two cores makes p95 worse, not better.
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_workers=2
    deploy:
      resources:
        limits:
          memory: 4096M

  embed:
    # ! THE EMBEDDER WAS NEVER PINNED HERE, and it is the largest CPU consumer
    # in the stack. This overlay constrained memory on all three services and
    # cores on two, so every "2 vCPU" latency figure it produced was measured
    # with the embedder using the whole dev box. That is where the published
    # 866 ms p50 came from.
    cpuset: "${VPS_CPUSET:-0,1}"
    deploy:
      resources:
        limits:
          # ! 3072M, not 1280M. float32 needs 2,553 MB anon and is the only
          # dtype that is both correct for this corpus and fast on CPU
          # (docs/HARDWARE.md §2).
          memory: 3072M

  engine:
    cpuset: "${VPS_CPUSET:-0,1}"
    deploy:
      resources:
        limits:
          memory: 512M
