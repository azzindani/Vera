# VPS emulation overlay · 2 vCPU / 4 GB.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# ! Testing on 14 cores and 48 GB proves nothing about the target box. The OOM
# guarantee (CLAUDE.md §5.4) and every latency number are claims about 2 vCPU /
# 4 GB, so they are only under test with this overlay on.
#
# cpuset pins db and engine to the SAME two host cores. A per-container `cpus:`
# limit cannot express that: on the real VPS, Postgres and the engine contend
# for two cores, and that contention is what sets p95 under concurrency. Give
# each its own pair and the numbers come out optimistic.
#
# The 4 GB budget, measured rather than guessed (see docs/HARDWARE.md §2):
#
#   embed   1280 MB   model weights measured at 1060 MB anon, + runtime
#   db      1792 MB   shared_buffers 512 + work_mem + the rest as page cache
#   engine   512 MB   8.5 MB resident + 4 concurrent x 23.4 MB worst in-flight
#   ----------------
#   total   3584 MB   leaving ~512 MB for the OS
#
# ! shared_buffers drops 1500 -> 512 MB. On a 4 GB box with a 2.4 GB database,
# page cache beats a big private buffer pool: every arm is a scan, and scans are
# exactly what Postgres declines to keep in shared_buffers anyway (it ring-
# buffers large sequential reads to avoid evicting everything else).

services:
  db:
    cpuset: "${VPS_CPUSET:-0,1}"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1200MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=32
      - -c
      - log_min_duration_statement=1000
      # 2 vCPU: one parallel worker, not the default 2. Three processes
      # competing for two cores makes p95 worse, not better.
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_workers=2
    deploy:
      resources:
        limits:
          memory: 1792M

  embed:
    deploy:
      resources:
        limits:
          memory: 1280M

  engine:
    cpuset: "${VPS_CPUSET:-0,1}"
    deploy:
      resources:
        limits:
          memory: 512M
