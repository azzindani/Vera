[package]
name = "vera-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Postgres and pgvector access. The only crate that talks to the database."

[dependencies]
# ! tokio-postgres, ✗ sqlx's query! macros. Those verify SQL against a live
# database at COMPILE time, which would mean CI needs Postgres to build, not
# just to test. Runtime queries keep `cargo build` hermetic.
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
vera-core = { version = "0.0.1", path = "../vera-core" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
