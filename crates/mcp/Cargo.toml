[package]
name = "vera-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP tool surface and transports. No domain logic."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
# ! preserve_order: without it serde_json sorts keys alphabetically and the
# contract's "success first" ordering silently stops holding.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# HTTP transport. `axum` only — no tower-http, no tracing stack: this
# server has five endpoints and a 2 vCPU budget to defend.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
contract = { path = "../contract" }
embed = { path = "../embed" }
engine = { path = "../engine" }
store = { path = "../store" }

[lints]
workspace = true
