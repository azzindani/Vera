[package]
name = "vera-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Routing layers, leaf scan and fusion. Pure retrieval logic with zero MCP imports."

[dependencies]
vera-core = { version = "0.0.1", path = "../vera-core" }
vera-embed = { version = "0.0.1", path = "../vera-embed" }
vera-store = { version = "0.0.1", path = "../vera-store" }
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
vera-index = { version = "0.0.1", path = "../vera-index" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
