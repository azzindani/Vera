[package]
name = "embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Embedding providers. Pinned remote client plus a deterministic stub."

[dependencies]
async-trait = "0.1.91"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
# rustls, not the platform TLS stack: one less thing that differs between a
# Linux container, a macOS runner and a Windows dev box.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
