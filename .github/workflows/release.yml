name: Release

# Tag-triggered binary release for the three supported platforms.
#
# ! No container image yet. pipeline.yaml declares an image_size_mb gate, but
# vera-mcp is still a stub — there is nothing to put in an image, and a gate
# with nothing to measure is theatre. Add the Docker job when the engine
# actually serves.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run; no release is published)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish half-way

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3

permissions:
  contents: write # required to create the release

jobs:
  # ! Gate the build on the same checks CI runs. A tag must never ship
  # something that would have failed on main.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.os }}-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.os }}-release-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="vera-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/Vera "dist/$name/vera"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          name="vera-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/Vera.exe "dist/$name/vera.exe"
          cp README.md "dist/$name/" 2>/dev/null || true
          powershell -Command "Compress-Archive -Path dist/$name -DestinationPath $name.zip"
          certutil -hashfile "$name.zip" SHA256 | sed -n '2p' > "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vera-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # Only a real tag publishes. workflow_dispatch builds and stops, so the
    # release path can be exercised without creating a release.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
