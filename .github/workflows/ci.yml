name: CI

# Two stages, mirroring pipeline.yaml:
#   fast — static + unit, on all three platforms
#   full — integration against a real Postgres, seeded from dev_tools/fixtures/seed.py
#
# The `full` stage runs on Linux only. It is testing SQL semantics against a
# Postgres server, and that server behaves the same whichever OS drove the
# client; paying three times for one answer buys nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A new push supersedes the old one instead of queueing
# behind it, so a busy branch does not sit waiting on stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a network hiccup rather than hanging the job for minutes.
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3
  # Smaller cache, faster restore. CI never opens a debugger.
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  # Formatting is platform-independent, so checking it once is enough.
  # Running it on all three would only add ways for line endings to bite.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # ! Never cancel siblings. A Windows-only failure is exactly the thing
      # this matrix exists to find, and fail-fast would hide whether Linux and
      # macOS were fine.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Lockfile in the key: dependencies change, cache changes. The OS is
          # in it too because target/ artifacts are not portable.
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Clippy
        # --all-targets covers tests and benches, not just the libraries;
        # -D warnings makes the workspace's pedantic lints actually binding.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # --locked so CI fails on an out-of-date Cargo.lock rather than
        # silently resolving different versions than the developer had.
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

  # The stage that would have caught the plainto_tsquery bug. `store`'s tests
  # are `#[ignore]`d because they need a loaded corpus; dev_tools/fixtures/seed.py builds
  # a ~30-row one in seconds, so "needs a database" stops meaning "never runs".
  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera
          POSTGRES_DB: vera
          # Same locale pin as docker-compose.yml: collation changes ORDER BY
          # on text, and a ranking that differs between CI and the laptop is
          # worse than no ranking test at all.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: host=localhost port=5432 dbname=vera user=vera password=vera

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg
        run: pip install --quiet "psycopg[binary]"

      # Pure-Python, no database needed, but this job is where Python already
      # is. The chunker decides what a retrieval unit IS, so a regression here
      # silently changes every number the eval harness reports.
      - name: Chunker tests
        run: python dev_tools/pre_embed/test_chunking.py

      - name: Seed the fixture corpus
        run: python dev_tools/fixtures/seed.py

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-cargo-

      # ! --ignored, not --include-ignored. These tests are the point of this
      # job; running the hermetic suite again here would only hide them in the
      # noise of the ones the matrix already ran on three platforms.
      - name: Integration tests · the SQL layer
        run: cargo test -p store --locked -- --ignored --nocapture

      # ! The WHOLE pipeline, startup canary included, with no embedding server.
      # The fixture's dense vectors are a pure function of (theme, body), so
      # FixtureProvider reproduces them exactly and the canary passes for real
      # rather than being bypassed. Before this, everything above the SQL layer
      # -- routing, the domain gate, fusion, factor scoring, the option
      # surface, the response contract -- was reachable only on a machine with
      # a GPU, which meant CI never touched it.
      - name: Integration tests · the pipeline
        env:
          VERA_FX_DSN: host=localhost port=5432 dbname=vera user=vera password=vera
        run: cargo test -p vera-mcp --locked -- --ignored --nocapture

  # ! The job that closes FAILURE_MODES §13. `SearchOps::text` has two SQL
  # paths and picks by probing for the RUM index; the `integration` job above
  # runs pgvector/pgvector:pg16, which has none, so it only ever exercises the
  # `ts_rank` FALLBACK. The deployment runs vera-db:pg16-rum and takes the
  # index-ordered path. Without this job the SQL that actually serves queries
  # is never executed by the gate.
  #
  # It also builds docker/Dockerfile.db, so a broken image is found by the pull
  # request rather than by the deploy.
  integration-rum:
    name: integration (postgres + rum)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: host=localhost port=5432 dbname=vera user=vera password=vera

    steps:
      - uses: actions/checkout@v4

      - name: Build the RUM-enabled image
        run: docker build -f docker/Dockerfile.db -t vera-db:ci .

      - name: Start it
        # Same locale pin as docker-compose.yml: collation changes ORDER BY on
        # text, and a ranking that differs between CI and the box is worse than
        # no ranking test at all.
        run: |
          docker run -d --name vera-db-ci \
            -e POSTGRES_USER=vera -e POSTGRES_PASSWORD=vera -e POSTGRES_DB=vera \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C" \
            -p 5432:5432 vera-db:ci
          for i in $(seq 1 40); do
            docker exec vera-db-ci pg_isready -U vera -d vera && exit 0
            sleep 2
          done
          echo "database never became ready" >&2
          docker logs vera-db-ci
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet "psycopg[binary]"

      - name: Seed the fixture corpus
        run: python dev_tools/fixtures/seed.py

      - name: Create the RUM index
        # ! After seeding. seed.py drops and recreates chunks, which would take
        # the index with it.
        run: docker exec -i vera-db-ci psql -U vera -d vera -v ON_ERROR_STOP=1 < migrations/0003_rum_text_index.sql

      - name: Prove RUM is actually in use
        # ! Without this the job could silently pass on the fallback — exactly
        # the failure it exists to catch.
        run: |
          docker exec vera-db-ci psql -U vera -d vera -tAc \
            "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname='rum')
                AND EXISTS (SELECT 1 FROM pg_class WHERE relname='chunks_tsv_rum')" \
            | grep -qx t || { echo "RUM not present · this job would test the fallback" >&2; exit 1; }

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-cargo-

      - name: Integration tests against the RUM path
        run: cargo test -p store --locked -- --ignored --nocapture

      # ! The pipeline over the RUM text arm, which is the query that actually
      # ships. The job above runs the same tests on a Postgres without RUM, so
      # between them both branches of `SearchOps::text` are exercised end to
      # end rather than only at the SQL layer.
      - name: Pipeline tests against the RUM path
        env:
          VERA_FX_DSN: host=localhost port=5432 dbname=vera user=vera password=vera
        run: cargo test -p vera-mcp --locked -- --ignored --nocapture

  # The engine image is built here for the same reason: so a broken Dockerfile
  # fails the pull request, ✗ the deploy. No registry push — CI proves it
  # builds, the deployment builds its own.
  image:
    name: engine image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.engine -t vera-engine:ci .
      - name: It starts and refuses without configuration
        # ! A build that produces an unrunnable binary still "builds". The
        # engine must exit non-zero and name the missing variable.
        run: |
          # ! `if`, not `cmd && { fail }`. GitHub runs these steps under
          # `bash -e`, where a failing AND-OR list still exits the script — so
          # the correct refusal would fail the step. An `if` condition is
          # exempt from -e.
          if out=$(docker run --rm vera-engine:ci 2>&1); then
            echo "expected a refusal, got success:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "DATABASE_URL is not set"
