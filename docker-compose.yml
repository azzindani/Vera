# Vera · the three-container stack.
#
#   cp .env.example .env && docker compose up -d
#
# ! Every credential and path comes from `.env`, ✗ from this file. A compose
# file with a password in it is a password in git history.
#
# The embedding container runs the SAME model that produced the corpus vectors
# — same weights, same pooling, same normalization — which is the whole of
# the corpus-declares-the-space rule (CLAUDE.md §5.2). It is not an LLM: TEI
# serves /embed only, and there is no completion endpoint anywhere in this stack.
#
# Resource limits are deliberately NOT set here — bulk-loading and index builds
# want the whole machine. Overlay the target profile to test the guarantees in
# docs/HARDWARE.md:
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d

name: vera

services:
  db:
    # ! Built, ✗ pulled: this image is pgvector plus RUM, which no published
    # image carries. See docker/Dockerfile.db for why that matters.
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    image: vera-db:pg16-rum
    container_name: vera-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # ! locale=C. Collation changes ORDER BY on text and BM25 tie-breaks;
      # pinning it keeps ranking reproducible across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      # Budget mirrors docs/HARDWARE.md even when the container is
      # unconstrained, so query plans resemble the target box's.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1500MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      # ! NVMe. The default 4.0 tells the planner random reads are expensive and
      # pushes it to seq-scan a partition the cluster index should have pruned.
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-32}
      - -c
      - log_min_duration_statement=1000
    # ! Bound to loopback. The database is reachable by the engine over the
    # compose network; publishing it on 0.0.0.0 puts the corpus on the internet
    # the first time this runs on a box with a public interface.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # ! Named volume. Without it a bulk load dies on `compose down`.
      - pgdata:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  embed:
    # ! Tag pinned, ✗ :latest. This container defines the vector space; an image
    # that updates underneath a loaded corpus breaks that rule silently.
    # The default tag targets CUDA compute capability 8.6; set EMBED_IMAGE for
    # other hardware.
    image: ${EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:86-1.7.2}
    container_name: vera-embed
    command:
      - --model-id=/data/model
      # ! Must match the model's 1_Pooling/config.json. Mean-pooling the same
      # weights yields a different vector space and silently plausible, wrong
      # rankings.
      - --pooling=${EMBED_POOLING:-last-token}
      - --dtype=${EMBED_DTYPE:-float16}
      - --max-client-batch-size=64
      # ! The model's full context. A lower value silently truncates long
      # chunks, embedding a vector that does not represent its text.
      # auto-truncate is deliberately OFF so an over-length chunk fails loudly.
      - --max-batch-tokens=${EMBED_MAX_BATCH_TOKENS:-32768}
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR in .env}:/data/model:ro
    ports:
      - "127.0.0.1:${EMBED_PORT:-8080}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # ! Loading and warming the model takes ~40s, and TEI accepts connections
      # before it can answer one. Without this the engine's startup canary hits
      # a live socket that refuses work, refuses to serve (correctly —
      # CLAUDE.md §7.3), exits, and restart-loops until the model is warm.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    image: vera-engine:${VERA_VERSION:-dev}
    container_name: vera-mcp
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      EMBED_ENDPOINT: ${EMBED_ENDPOINT:?set EMBED_ENDPOINT in .env}
      BM25_VOCAB: ${BM25_VOCAB:?set BM25_VOCAB in .env}
      TRANSPORT: ${TRANSPORT:-http}
      HTTP_ADDR: ${HTTP_ADDR:-0.0.0.0:8081}
      # ! Peak RAM is fixed cost + MAX_CONCURRENCY × per-request ceiling
      # (CLAUDE.md §5.4). Raising this raises the memory limit the target
      # overlay sets; the two are one decision, ✗ two.
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
      QUEUE_WAIT_MS: ${QUEUE_WAIT_MS:-2000}
      CLUSTERS_PROBED: ${CLUSTERS_PROBED:-5}
      # ! Latency only. Engine RSS measured flat at 14/12/14 MB across 1/2/5,
      # because the engine never holds a cluster -- Postgres does the scan and
      # returns ranked ids (docs/HARDWARE.md §6a). 5 is worth -182 ms.
      CLUSTER_BATCH: ${CLUSTER_BATCH:-1}
      # ! 2.0, ✗ the 0.0 this carried until 2026-09-19. The old corpus was
      # embedded by a provider that did not reproduce the declared space, so the
      # dense arm was muted on purpose; a stale default here would silently mute
      # it again for anyone who brings the stack up without a .env.
      DENSE_WEIGHT: ${DENSE_WEIGHT:-2.0}
      SPARSE_WEIGHT: ${SPARSE_WEIGHT:-1.0}
      TEXT_WEIGHT: ${TEXT_WEIGHT:-1.0}
    volumes:
      # ! Sparse vectors are indexed by vocabulary POSITION. Serving a corpus
      # against another run's vocabulary compares unrelated dimensions and
      # returns plausible nonsense rather than failing, so the vocab is mounted
      # beside the corpus it was built from.
      - ${VOCAB_DIR:?set VOCAB_DIR in .env}:/vocab:ro
    ports:
      - "${ENGINE_BIND:-127.0.0.1}:${ENGINE_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
      embed:
        # ! service_healthy, ✗ service_started. A started TEI is not a TEI that
        # can embed; see its healthcheck above.
        condition: service_healthy
    healthcheck:
      # ! /health, ✗ a TCP probe. The engine binds its port before it loads
      # centroids and runs the startup canary, so a socket that accepts proves
      # only that the process started, not that it will answer.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # ! Read-only root. The query path never writes (CLAUDE.md §5.6) and the
    # container holds no state, so anything that tries is a bug worth crashing.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
